name: Build API

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/build.yaml"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image name
        id: vars
        run: |
          OWNER=$(
            echo "${GITHUB_REPOSITORY_OWNER}" \
            | tr '[:upper:]' '[:lower:]'
          )

          echo "image=ghcr.io/${OWNER}/cka-api" \
            >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ github.sha }}

      - name: Update Kustomize Image Tag
        run: |
          sed -i \
            "s/newTag: .*/newTag: ${GITHUB_SHA}/" \
            deploy/overlays/local/kustomization.yaml

      - name: Commit GitOps Change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add deploy/overlays/local/kustomization.yaml

          git diff --cached --quiet \
            && exit 0

          git commit \
            -m "chore: deploy ${GITHUB_SHA}"

          git push
