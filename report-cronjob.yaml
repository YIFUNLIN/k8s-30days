apiVersion: batch/v1
kind: CronJob

metadata:
  name: report-job
  namespace: cka-lab

spec:
  schedule: "*/5 * * * *"

  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never

          containers:
            - name: report
              image: busybox:1.36
              command:
                - sh
                - -c
                - 'date; echo "Generating report"'
