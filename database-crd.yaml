apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition

metadata:
  name: databases.example.ironman

spec:
  group: example.ironman

  scope: Namespaced

  names:
    plural: databases
    singular: database
    kind: Database
    shortNames:
      - dbdemo

  versions:
    - name: v1

      served: true
      storage: true

      schema:
        openAPIV3Schema:
          type: object

          properties:
            spec:
              type: object

              properties:
                engine:
                  type: string

                size:
                  type: string
